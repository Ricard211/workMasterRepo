rules:
  - id: inline-script-tag
    message: "Avoid using inline <script> tags — use external JS files for better security and maintainability."
    severity: WARNING
    languages: [html]
    pattern: '<script>'
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"

  - id: javascript-link
    message: "Avoid using 'javascript:' in href attributes — this can lead to XSS vulnerabilities."
    severity: WARNING
    languages: [html]
    pattern: 'href="javascript:*"'
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting (XSS)"

  - id: insecure-form-method
    message: "Form should use POST method to avoid leaking sensitive data via GET."
    severity: WARNING
    languages: [html]
    pattern: '<form>'
    metadata:
      category: security
      cwe: "CWE-598: Information Exposure Through Query Strings in GET Request"

  - id: inline-event-handler
    message: "Avoid inline event handlers (e.g., onclick) in HTML — move to JS files."
    severity: WARNING
    languages: [html]
    pattern-either:
      - pattern: 'onclick="..."'
      - pattern: 'onload="..."'
      - pattern: 'onmouseover="..."'
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting (XSS)"

  - id: password-autocomplete
    message: "Input type=password should disable autocomplete."
    severity: WARNING
    languages: [html]
    pattern: '<input type="password">'
    metadata:
      category: security
      cwe: "CWE-524: Use of Cacheable Password Forms"

  - id: insecure-iframe
    message: "Avoid using <iframe> without sandbox attribute — this can lead to clickjacking."
    severity: WARNING
    languages: [html]
    pattern: '<iframe>'
    metadata:
      category: security
      cwe: "CWE-1021: Improper Restriction of Rendered UI Layers or Frames"

  - id: mixed-content
    message: "Avoid mixed content (HTTP and HTTPS) — this can lead to security vulnerabilities."
    severity: WARNING
    languages: [html]
    pattern: 'http://*'
    metadata:
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
    
  - id: insecure-cookies
    message: "Cookies should have Secure and HttpOnly flags set."
    severity: WARNING
    languages: [html]
    pattern: 'Set-Cookie:'
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"

  - id: insecure-headers
    message: "HTTP headers should be set to prevent XSS and content sniffing."
    severity: WARNING
    languages: [html]
    pattern: 'X-Content-Type-Options: nosniff'
    metadata:
      category: security
      cwe: "CWE-16: Configuration"

  - id: insecure-csp
    message: "Content Security Policy (CSP) should be set to prevent XSS."
    severity: WARNING
    languages: [html]
    pattern: 'Content-Security-Policy:'
    metadata:
      category: security
      cwe: "CWE-16: Configuration"

  - id: insecure-ssl
    message: "SSL/TLS should be enforced for all pages."
    severity: WARNING
    languages: [html]
    pattern: 'http://*'
    metadata:
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"

  - id: insecure-redirect
    message: "Avoid open redirects — validate redirect URLs."
    severity: WARNING
    languages: [html]
    pattern: 'window.location.href'
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"

  - id: insecure-xml
    message: "Avoid using XML without proper validation — this can lead to XXE vulnerabilities."
    severity: WARNING
    languages: [html]
    pattern: '<xml>'
    metadata:
      category: security
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"

  - id: insecure-json
    message: "Avoid using JSON without proper validation — this can lead to security vulnerabilities."
    severity: WARNING
    languages: [html]
    pattern: '<json>'
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"

  - id: insecure-ajax
    message: "Avoid using AJAX without proper validation — this can lead to security vulnerabilities."
    severity: WARNING
    languages: [html]
    pattern: 'XMLHttpRequest'
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"

  - id: insecure-websocket

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
        nav {
            background-color: #444;
            color: white;
            padding: 0.5rem;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 1rem;
            text-decoration: none;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
        }
        .product {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 1rem;
            text-align: center;
            width: 200px;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
        .cart {
            margin: 1rem;
            padding: 1rem;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Tool Shop</h1>
    </header>
    <nav>
        <a href="#products">Products</a>
        <a href="#cart">Cart</a>
    </nav>
    <main>
        <section id="products" class="products">
            <div class="product">
                <img src="https://via.placeholder.com/150?text=Hammer" alt="Hammer">
                <h2>Hammer</h2>
                <p>$12.00</p>
                <button onclick="addToCart('Hammer', 12)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/150?text=Screwdriver" alt="Screwdriver">
                <h2>Screwdriver</h2>
                <p>$8.00</p>
                <button onclick="addToCart('Screwdriver', 8)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/150?text=Wrench" alt="Wrench">
                <h2>Wrench</h2>
                <p>$10.00</p>
                <button onclick="addToCart('Wrench', 10)">Add to Cart</button>
            </div>
            <div class="listing">
                <img src="https://via.placeholder.com/300x200" alt="House 1">
                <h2>Modern Family Home</h2>
                <p>Price: $350,000</p>
                <p>Location: Springfield</p>
                <button onclick="inquire('Modern Family Home')">Inquire</button>
            </div>
        </section>
        <section id="cart" class="cart">
            <h2>Shoppfffing Cart</h2>
            <ul id="cartItems"></ul>
            <p>Total: $<span id="totalPrice">0.00</span></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Tool Shop</p>
    </footer>
    <script>
        const cartItems = [];
        let totalPrice = 0;

        function addToCart(productName, productPrice) {
            cartItems.push({ name: productName, price: productPrice });
            totalPrice += productPrice;
            updateCart();
        }

        function updateCart() {
            const cartItemsList = document.getElementById('cartItems');
            const totalPriceElement = document.getElementById('totalPrice');
            cartItemsList.innerHTML = '';
            cartItems.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.name} - $${item.price.toFixed(2)}`;
                cartItemsList.appendChild(li);
            });
            totalPriceElement.textContent = totalPrice.toFixed(2);
        }
    </script>
</body>
</html>
